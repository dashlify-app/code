<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" width="64" height="64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#E8F5E9" stroke="none"/>

  <!-- Spreadsheet grid icon - Premium style -->
  <g transform="translate(32, 32)">
    <!-- Grid border -->
    <rect x="-12" y="-12" width="24" height="24" fill="none" stroke="#388E3C" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Vertical grid lines -->
    <line x1="-4" y1="-12" x2="-4" y2="12" stroke="#388E3C" stroke-width="1.5" opacity="0.9"/>
    <line x1="4" y1="-12" x2="4" y2="12" stroke="#388E3C" stroke-width="1.5" opacity="0.9"/>

    <!-- Horizontal grid lines -->
    <line x1="-12" y1="-4" x2="12" y2="-4" stroke="#388E3C" stroke-width="1.5" opacity="0.9"/>
    <line x1="-12" y1="4" x2="12" y2="4" stroke="#388E3C" stroke-width="1.5" opacity="0.9"/>

    <!-- Data accent - Small dots in cells -->
    <circle cx="-8" cy="-8" r="1.2" fill="#388E3C" opacity="0.7"/>
    <circle cx="0" cy="-8" r="1.2" fill="#388E3C" opacity="0.7"/>
    <circle cx="8" cy="-8" r="1.2" fill="#388E3C" opacity="0.5"/>
    <circle cx="-8" cy="0" r="1.2" fill="#388E3C" opacity="0.5"/>
    <circle cx="0" cy="0" r="1.2" fill="#388E3C" opacity="0.8"/>
    <circle cx="8" cy="0" r="1.2" fill="#388E3C" opacity="0.6"/>
  </g>
</svg>