<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" width="64" height="64">
  <!-- Fondo círculo verde -->
  <circle cx="32" cy="32" r="30" fill="#34A853" opacity="0.15" />

  <!-- Hoja principal -->
  <g transform="translate(32, 32)">
    <!-- Cuerpo principal -->
    <rect x="-14" y="-16" width="28" height="32" rx="2" fill="#34A853" />

    <!-- Grid lines - verticales -->
    <line x1="-6" y1="-14" x2="-6" y2="14" stroke="white" stroke-width="1.5" opacity="0.9" />
    <line x1="2" y1="-14" x2="2" y2="14" stroke="white" stroke-width="1.5" opacity="0.9" />
    <line x1="10" y1="-14" x2="10" y2="14" stroke="white" stroke-width="1.5" opacity="0.9" />

    <!-- Grid lines - horizontales -->
    <line x1="-14" y1="-6" x2="14" y2="-6" stroke="white" stroke-width="1.5" opacity="0.9" />
    <line x1="-14" y1="2" x2="14" y2="2" stroke="white" stroke-width="1.5" opacity="0.9" />
    <line x1="-14" y1="10" x2="14" y2="10" stroke="white" stroke-width="1.5" opacity="0.9" />

    <!-- Datos (pequeños rectángulos en celdas) -->
    <rect x="-11" y="-12" width="3" height="3" fill="white" opacity="0.8" />
    <rect x="-3" y="-12" width="3" height="3" fill="white" opacity="0.7" />
    <rect x="5" y="-12" width="3" height="3" fill="white" opacity="0.6" />

    <rect x="-11" y="-4" width="3" height="3" fill="white" opacity="0.7" />
    <rect x="-3" y="-4" width="3" height="3" fill="white" opacity="0.8" />
    <rect x="5" y="-4" width="3" height="3" fill="white" opacity="0.6" />

    <rect x="-11" y="4" width="3" height="3" fill="white" opacity="0.6" />
    <rect x="-3" y="4" width="3" height="3" fill="white" opacity="0.7" />
    <rect x="5" y="4" width="3" height="3" fill="white" opacity="0.8" />
  </g>
</svg>
